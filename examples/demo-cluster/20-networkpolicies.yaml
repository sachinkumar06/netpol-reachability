# Intent: "the frontend can call the API on 8080".
# This policy is correct -- and, on its own, insufficient.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-frontend
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
---
# Added later by a different team: "the frontend should only talk to the DB".
# It silently revokes the frontend -> api path above, because egress becomes
# default-deny for the frontend and 8080 is not in the allowlist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-lockdown
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: database
      ports:
        - protocol: TCP
          port: 5432
---
# Belt-and-braces database lockdown with no ingress rules at all.
# This denies everything into the database, including the frontend path the
# egress policy above was written to permit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-deny-all-ingress
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes: ["Ingress"]
---
# Cross-namespace scrape path. This one genuinely works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: prod
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              purpose: observability
      ports:
        - protocol: TCP
          port: 8080
