[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpol-reachability"
version = "0.1.0"
description = "Compute what Kubernetes NetworkPolicies actually allow, and diff it against declared intent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "kubernetes",
    "networkpolicy",
    "network-policy",
    "reachability",
    "zero-trust",
    "security",
    "openshift",
    "cilium",
    "calico",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.scripts]
netpol-reachability = "netpol_reachability.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/netpol-reachability"
Issues = "https://github.com/OWNER/netpol-reachability/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/netpol_reachability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
